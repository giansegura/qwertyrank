# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Automatic review of every PR with CodeRabbit (GitHub app, installed separately: docs/launch.md §11).
# It comments; it doesn't block merging. The project rules are in AGENTS.md, CLAUDE.md and docs/.
language: en-US
tone_instructions: "Direct and concrete, in English. Each comment says what is wrong, in which case and how to fix it."

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!pnpm-lock.yaml"
    - "!drizzle/meta/**"
  path_instructions:
    - path: "src/**"
      instructions: >-
        Next.js 16 and next-intl 4: their APIs differ from earlier versions (`params` is a Promise,
        the middleware is `src/proxy.ts`). Don't suggest patterns from old versions. The home page has a
        JS budget of 30,720 B (`pnpm budget`): flag any new import that reaches its client.
    - path: "src/server/anticheat/**"
      instructions: >-
        The player must never see the exact rule that rejects a game (spec §4.9), and a shadow ban must not
        be noticeable from outside (spec §4.7).
    - path: "messages/**"
      instructions: >-
        en, es and pt must have exactly the same keys. Check that the translation says the same thing
        in all three. In es the percentage has a space (`97 %`); in en and pt, it doesn't (`97%`).
    - path: "drizzle/**"
      instructions: >-
        Migrations are applied in the Vercel build against production: flag any change that locks
        large tables or loses data.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CLAUDE.md"

chat:
  auto_reply: true
