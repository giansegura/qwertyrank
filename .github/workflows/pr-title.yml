# PRs are only merged with squash and their title becomes the commit on main (CLAUDE.md): the title has to
# follow Conventional Commits. Checked when the PR is opened, when the title changes and on every push.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: conventional-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The types from CLAUDE.md; the scope is optional and `!` marks a breaking change.
          types: |
            feat
            fix
            refactor
            perf
            test
            docs
            style
            build
            ci
            chore
            revert
          requireScope: false
          # Lowercase description with no trailing period.
          subjectPattern: ^(?![A-Z]).*[^.]$
          subjectPatternError: |
            The description "{subject}" of the title "{title}" has to start in lowercase and not end with a period.
            Example: feat(ranked): validate games on the server
