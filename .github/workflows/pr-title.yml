# Las PR solo se integran con squash y su título pasa a ser el commit en main (CLAUDE.md): el título tiene que
# seguir Conventional Commits. Se comprueba al abrir la PR, al cambiar el título y en cada push.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: conventional-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Los tipos de CLAUDE.md; el ámbito es opcional y `!` marca un cambio incompatible.
          types: |
            feat
            fix
            refactor
            perf
            test
            docs
            style
            build
            ci
            chore
            revert
          requireScope: false
          # Descripción en minúscula y sin punto final.
          subjectPattern: ^(?![A-Z]).*[^.]$
          subjectPatternError: |
            La descripción "{subject}" del título "{title}" tiene que empezar en minúscula y no terminar en punto.
            Ejemplo: feat(ranked): validate games on the server
